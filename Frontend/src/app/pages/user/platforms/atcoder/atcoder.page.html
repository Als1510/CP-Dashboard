<ion-content>
  <div class="header">
    <img src="../../../../../assets/Platforms/atcoder.png" alt="">
    <h1>Atcoder</h1>
    <ion-button class="refresh-btn" *ngIf="userData" [disabled]="isRefreshing" (click)="refreshUserData()">
      <ion-icon name="refresh-outline" *ngIf="!isRefreshing"></ion-icon>
      <ion-spinner name="crescent" *ngIf="isRefreshing"></ion-spinner>
    </ion-button>
  </div>
  <div class="container" *ngIf="userData; else noData">
    <ion-card class="wrapper" *ngIf="loaded">
      <div class="box">
        <h2>User Profile</h2>
        <div class="user_details">
        <p class="username">{{userData.username || username}}</p>
        <div class="level" *ngIf="userData.level && userData.level !== 'NA'">
          <ion-icon name="people-outline"></ion-icon>
          Level: {{userData.level}}
        </div>
        <div class="rank" *ngIf="userData.rank && userData.rank !== 'NA'">
          <ion-icon name="trophy-outline"></ion-icon>
          Rank: {{userData.rank}}
        </div>
        <p class="data" *ngIf="userData.rating && userData.rating !== 'NA'">Rating: <span>{{userData.rating}}</span></p>
        <p class="data" *ngIf="userData.highest_rating && userData.highest_rating !== 'NA'">Highest Rating: <span>{{userData.highest_rating}}</span></p>
      </div>
      </div>
      <img src="../../../../../assets/Utils/leetcode_avatar.jpg" alt="">
      <!-- Unavailable backend fields gated: TopCoderID, TwitterID, CodeforcesID, LastCompeted, Rated Matches, BirthYear, CountryRegion, Affiliation -->
    </ion-card>
  </div>
  <ng-template #noData>
    <ion-card class="noData">
      <p>No User Data</p>
    </ion-card>
  </ng-template>
</ion-content>
